name: Reserva Zityhub

on:
  schedule:
    # Arranca ~15 min ANTES de la medianoche de Madrid y el script espera despierto
    # a que se abra el dia nuevo. Minuto 47 y no en punto: el cron de GitHub es best
    # effort y las horas en punto son las mas congestionadas.
    - cron: '47 21 * * 0-4'   # 23:47 Madrid en horario de verano
    - cron: '47 22 * * 0-4'   # 23:47 Madrid en horario de invierno
  workflow_dispatch:
    inputs:
      modo:
        description: 'simulacion = no reserva nada | real = reserva de verdad'
        type: choice
        options:
          - simulacion
          - real
        default: simulacion

concurrency:
  group: reserva-zityhub
  cancel-in-progress: false

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reservar puesto
        env:
          ZITYHUB_COOKIE: ${{ secrets.ZITYHUB_COOKIE }}
          ZITYHUB_EMAIL: ${{ secrets.ZITYHUB_EMAIL }}
          ZITYHUB_PASSWORD: ${{ secrets.ZITYHUB_PASSWORD }}

          ZH_PERSON_ID: '39367'
          ZH_SPACE_ID: '32154'
          ZH_DESK_IDS: '32256,32286'    # Desk 102 preferido, Desk 132 de reserva
          ZH_START: '09:00'
          ZH_END: '18:00'
          ZH_FALLBACK: 'fail'           # 'any' para coger cualquier puesto libre
          ZH_ADVANCE_DAYS: '5'
          ZH_HOLIDAYS: ${{ vars.ZH_HOLIDAYS }}

          # Si arranca antes de medianoche, espera hasta 45 min a que abra el dia.
          # Si el cron llega tarde, no espera nada y dispara ya.
          ZH_WAIT_FOR_MIDNIGHT: '1'
          ZH_MAX_WAIT_MIN: '45'

          # Y luego reintenta 20 min por si alguien cancela o la API tarda en abrir.
          ZH_ATTEMPTS: '40'
          ZH_ATTEMPT_GAP_MS: '30000'

          # Un job en verde tiene que significar "hay reserva", no "el script no
          # reviento". En las tiradas programadas el script consulta Zityhub al
          # terminar y falla si la reserva no aparece de verdad.
          ZH_REQUIRE_BOOKING: ${{ github.event_name == 'schedule' && '1' || '0' }}

          # Solo simula cuando se lanza a mano y se pide expresamente. En las
          # ejecuciones programadas 'inputs.modo' viene vacio: tienen que ser reales.
          ZH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.modo != 'real' && '1' || '0' }}
        run: node book.mjs
